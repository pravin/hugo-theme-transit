baseURL = "https://example.com/"
locale = "en-GB"
title = "Pravin Paratey"
theme = "hugo-theme-transit"
# Lets you run `hugo server` from inside exampleSite/ without copying the theme.
# Remove this line in your own site.
themesDir = "../.."

# Optional. Supports {year}, e.g. "&copy; {year} Your Name"
# copyright = ""

[pagination]
  pagerSize = 10

# Uncomment and fill in to enable comments (Disqus) and analytics (production builds only).
[services]
  [services.disqus]
    # shortname = ""
  [services.googleAnalytics]
    # ID = "G-XXXXXXXXXX"

[params]
  title = "Pravin Paratey"
  tagline = "Thoughts on engineering and management"
  author = "Pravin Paratey"
  authorImgPath = "/img/author.png"
  authorBlurb = "Something about me"
  # Which sections appear on the map, the home page and the RSS feed
  mainSections = ["posts"]
  # Colour scheme: "auto" follows the visitor's OS setting; "light" or "dark" forces one
  defaultTheme = "auto"
  # Show the light/dark toggle in the header
  themeToggle = true

  # Settings for the map. All are optional.
  [params.transit]
    # The taxonomy whose terms become lines
    taxonomy = "tags"
    # How many lines to draw on the map (the busiest tags win)
    maxLines = 8
    # How many of the newest stations get a name on the map (0 hides names)
    labels = 12
    # Sentence shown under the tagline on the home page
    intro = "Every topic is a line. Every article is a station. Change lines wherever they meet."
    # Line colours, assigned to the busiest tags in order. Use colours dark enough for white text.
    # palette = ["#C62828", "#1565C0", "#2E7D32", "#6A1B9A", "#B84A00", "#00796B", "#AD1457", "#795548", "#303F9F", "#7C6A0A"]
    # Pin a colour or a two-letter code to a tag
    [params.transit.colors]
      markdown = "#C62828"
    [params.transit.codes]
      markdown = "MD"

  # If you do not want a social link, comment it out
  [params.social]
    email = "mailto:example@example.com"
    mastodon = "https://mstdn.social/@example"
    bluesky = "https://bsky.app/profile/example.com"
    github = "https://github.com/example"
    linkedin = "https://www.linkedin.com/in/example"
    # twitteruser = "@example"

# Optional: replace the default Map / Stations / Lines / About links
# [[menus.main]]
#   name = "Articles"
#   pageRef = "/posts"
#   weight = 10

[markup]
  # The theme ships light and dark syntax colours, which need CSS classes
  [markup.highlight]
    noClasses = false
  # Allows raw HTML in markdown content and in markdownify'd descriptions.
  [markup.goldmark.renderer]
    unsafe = true
